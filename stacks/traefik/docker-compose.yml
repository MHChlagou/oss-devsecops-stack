services:
  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: traefik
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    # HTTP (redirect), HTTPS for every sub-path tool, and one TLS port each for the tools that
    # cannot run under a sub-path. Entry points are generated by scripts/10-traefik.sh.
    ports:
      - "${TRAEFIK_HTTP_PORT}:${TRAEFIK_HTTP_PORT}"
      - "${TRAEFIK_HTTPS_PORT}:${TRAEFIK_HTTPS_PORT}"
      - "${REGISTRY_PORT}:${REGISTRY_PORT}"
      - "${VAULT_HTTP_PORT}:${VAULT_HTTP_PORT}"
      - "${DEFECTDOJO_HTTP_PORT}:${DEFECTDOJO_HTTP_PORT}"
      - "${DTRACK_HTTP_PORT}:${DTRACK_HTTP_PORT}"
      - "${DTRACK_API_PORT}:${DTRACK_API_PORT}"
      - "${TEST_ENV_PORT_FIRST}-${TEST_ENV_PORT_LAST}:${TEST_ENV_PORT_FIRST}-${TEST_ENV_PORT_LAST}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${DATA_ROOT}/traefik/dynamic:/etc/traefik/dynamic:ro
      - ${DATA_ROOT}/traefik/certs:/certs:ro
      - ${DATA_ROOT}/traefik/usersfile:/etc/traefik/usersfile:ro
    networks:
      - devsecops
      - test-envs
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=PathPrefix(`/dashboard`) || PathPrefix(`/api`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls=true
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=traefik-auth
      - traefik.http.middlewares.traefik-auth.basicauth.usersfile=/etc/traefik/usersfile

networks:
  devsecops:
    external: true
    name: ${DOCKER_NETWORK}
  test-envs:
    external: true
    name: ${TEST_ENV_NETWORK}
