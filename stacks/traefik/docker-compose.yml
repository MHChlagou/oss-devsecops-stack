services:
  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: traefik
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    # One published port per tool; the matching entry points are generated by scripts/10-traefik.sh.
    ports:
      - "${TRAEFIK_DASHBOARD_PORT}:${TRAEFIK_DASHBOARD_PORT}"
      - "${GITEA_HTTP_PORT}:${GITEA_HTTP_PORT}"
      - "${JENKINS_HTTP_PORT}:${JENKINS_HTTP_PORT}"
      - "${SONARQUBE_HTTP_PORT}:${SONARQUBE_HTTP_PORT}"
      - "${NEXUS_HTTP_PORT}:${NEXUS_HTTP_PORT}"
      - "${REGISTRY_PORT}:${REGISTRY_PORT}"
      - "${KEYCLOAK_HTTP_PORT}:${KEYCLOAK_HTTP_PORT}"
      - "${VAULT_HTTP_PORT}:${VAULT_HTTP_PORT}"
      - "${DEFECTDOJO_HTTP_PORT}:${DEFECTDOJO_HTTP_PORT}"
      - "${DTRACK_HTTP_PORT}:${DTRACK_HTTP_PORT}"
      - "${DTRACK_API_PORT}:${DTRACK_API_PORT}"
      - "${GRAFANA_HTTP_PORT}:${GRAFANA_HTTP_PORT}"
      - "${PROMETHEUS_HTTP_PORT}:${PROMETHEUS_HTTP_PORT}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${DATA_ROOT}/traefik/dynamic:/etc/traefik/dynamic:ro
      - ${DATA_ROOT}/traefik/certs:/certs:ro
      - ${DATA_ROOT}/traefik/usersfile:/etc/traefik/usersfile:ro
    networks:
      - devsecops
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=PathPrefix(`/`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls=true
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=traefik-auth
      - traefik.http.middlewares.traefik-auth.basicauth.usersfile=/etc/traefik/usersfile

networks:
  devsecops:
    external: true
    name: ${DOCKER_NETWORK}
