services:
  gitea-db:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/gitea/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  gitea:
    image: ${GITEA_IMAGE}
    container_name: gitea
    restart: unless-stopped
    depends_on:
      gitea-db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__DOMAIN: ${GITEA_HOST}
      GITEA__server__ROOT_URL: ${GITEA_URL}/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_DOMAIN: ${GITEA_HOST}
      # Links, clone URLs and redirects always come from ROOT_URL (with its /gitea sub-path), never
      # from request headers, which behind the prefix-stripping proxy would lose the sub-path.
      GITEA__server__PUBLIC_URL_DETECTION: never
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT}
      GITEA__server__SSH_LISTEN_PORT: "22"
      GITEA__server__LFS_START_SERVER: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__actions__ENABLED: "false"
      # Outgoing requests from webhooks and OAuth2 clients: strict mode allows only the listed
      # targets, the platform host (see GITEA_WEBHOOK_ALLOWED_HOSTS in lib/common.sh), so a
      # repository admin cannot aim webhooks at other internal or external services.
      GITEA__security__EGRESS_MODE: strict
      GITEA__security__ALLOWED_HOST_LIST: "${GITEA_WEBHOOK_ALLOWED_HOSTS}"
      # Webhooks target Jenkins behind Traefik's certificate (self-signed by default). Go reads
      # every certificate in these directories, so the platform certificate is trusted and
      # verification stays on. The directory holds the public certificate only, copied by
      # scripts/30-gitea.sh; Traefik's private key is never mounted here. Empty in ports mode.
      SSL_CERT_DIR: /etc/ssl/certs:/platform-certs
      GITEA__log__LEVEL: Info
    ports:
      - "${GITEA_SSH_PORT}:22"
    volumes:
      - ${DATA_ROOT}/gitea/data:/data
      - ${DATA_ROOT}/gitea/trust:/platform-certs:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - internal
      - devsecops
    labels:
      - traefik.enable=true
      # Gitea serves its routes at the root and prefixes the links it generates with ROOT_URL,
      # so the proxy strips the sub-path (the layout its reverse-proxy docs describe).
      - traefik.http.routers.gitea.rule=PathPrefix(`${GITEA_URL_PATH}`)
      - traefik.http.routers.gitea.entrypoints=websecure
      - traefik.http.routers.gitea.tls=true
      - traefik.http.routers.gitea.middlewares=gitea-strip
      - traefik.http.middlewares.gitea-strip.stripprefix.prefixes=${GITEA_URL_PATH}
      - traefik.http.services.gitea.loadbalancer.server.port=3000

networks:
  internal:
  devsecops:
    external: true
    name: ${DOCKER_NETWORK}
