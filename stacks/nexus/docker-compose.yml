services:
  nexus:
    image: ${NEXUS_IMAGE}
    container_name: nexus
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      INSTALL4J_ADD_VM_PARAMS: -Xms2g -Xmx2g -XX:MaxDirectMemorySize=2g -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    volumes:
      - ${DATA_ROOT}/nexus/data:/nexus-data
    networks:
      - devsecops
    labels:
      - traefik.enable=true
      - traefik.http.routers.nexus.rule=Host(`nexus.${DOMAIN}`)
      - traefik.http.routers.nexus.entrypoints=websecure
      - traefik.http.routers.nexus.tls=true
      - traefik.http.routers.nexus.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.nexus.service=nexus
      - traefik.http.services.nexus.loadbalancer.server.port=8081
      # Docker registry connector (configure a hosted docker repo on HTTP port 5000 in the Nexus UI)
      - traefik.http.routers.registry.rule=Host(`registry.${DOMAIN}`)
      - traefik.http.routers.registry.entrypoints=websecure
      - traefik.http.routers.registry.tls=true
      - traefik.http.routers.registry.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.registry.service=registry
      - traefik.http.services.registry.loadbalancer.server.port=5000

networks:
  devsecops:
    external: true
    name: ${DOCKER_NETWORK}
