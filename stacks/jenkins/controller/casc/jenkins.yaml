# Settings listed here are re-applied at every Jenkins start and overwrite UI edits. Keep this file to
# what must stay fixed (security, executors, the build cloud, the URL); everything else, including the
# system message, is managed in the UI and persists in the Jenkins home.
jenkins:
  numExecutors: 0
  mode: EXCLUSIVE
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: ${JENKINS_ADMIN_USER}
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  remotingSecurity:
    enabled: true
  crumbIssuer: standard
  clouds:
    - docker:
        name: "local-docker"
        dockerApi:
          dockerHost:
            uri: "tcp://docker-socket-proxy:2375"
          connectTimeout: 60
          readTimeout: 60
        containerCap: ${JENKINS_MAX_AGENTS}
        templates:
          - name: "docker-agent"
            labelString: "docker-agent"
            mode: EXCLUSIVE
            pullStrategy: PULL_NEVER
            remoteFs: "/home/jenkins/agent"
            instanceCapStr: "${JENKINS_MAX_AGENTS}"
            removeVolumes: true
            connector:
              attach:
                user: "jenkins"
            dockerTemplateBase:
              image: "devsecops/jenkins-agent:local"
              network: "jenkins-internal"
              environmentsString: "DOCKER_HOST=tcp://docker-socket-proxy:2375"

security:
  gitHostKeyVerificationConfiguration:
    sshHostKeyVerificationStrategy: "acceptFirstConnectionStrategy"

unclassified:
  location:
    url: ${JENKINS_URL}
    adminAddress: "${ADMIN_EMAIL}"
